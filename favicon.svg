<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Red background with rounded corners -->
  <rect width="512" height="512" rx="48" ry="48" fill="#E31B23"/>
  <!-- White V (left) -->
  <polygon points="60,120 120,120 200,340 160,340" fill="#FFFFFF"/>
  <polygon points="200,340 240,340 160,340 200,260" fill="#FFFFFF"/>
  <!-- Yellow checkmark V (middle) -->
  <polygon points="180,120 240,120 310,320 270,320" fill="#FFF200"/>
  <polygon points="270,320 310,320 390,120 430,120 340,360 230,360" fill="#FFF200"/>
  <!-- White I -->
  <rect x="250" y="120" width="50" height="220" fill="#FFFFFF"/>
  <!-- White V (right) -->
  <polygon points="340,120 400,120 480,340 440,340" fill="#FFFFFF"/>
  <polygon points="440,340 480,340 400,340 440,260" fill="#FFFFFF"/>
</svg>